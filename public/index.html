<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Mazel-lot</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="layoutContainer">
    <div class="controlPanel">
      <h1>Simulation A*</h1>
      <div class="statusRow">
        <div class="statusBlock">
          <div class="statusLabel">Grille</div>
          <div id="gridTypeLabel" class="statusValue"></div>
        </div>
        <div class="statusBlock">
          <div class="statusLabel">Étape</div>
          <div id="stepLabel" class="statusValue"></div>
        </div>
        <div class="statusBlock">
          <div class="statusLabel">Cible</div>
          <div id="targetLabel" class="statusValue"></div>
        </div>
      </div>

      <div class="buttonRow">
        <button id="computeSegmentButton">Calculer le segment</button>
        <button id="confirmSegmentButton" class="accent">Valider le passage</button>
        <button id="resetAllButton" class="ghost">Réinitialiser</button>
      </div>

      <div class="legendContainer">
        <div class="legendTitle">Légende</div>
        <ul class="legendList">
          <li><span class="legendBox legendCurrent"></span> Position actuelle</li>
          <li><span class="legendBox legendCheckpoint"></span> Point de passage</li>
          <li><span class="legendBox legendTreasure"></span> Trésor</li>
          <li><span class="legendBox legendDoor"></span> Porte</li>
          <li><span class="legendBox legendExit"></span> Sortie (grille 2)</li>
          <li><span class="legendBox legendPath"></span> Tracé A*</li>
        </ul>
      </div>
    </div>

    <div class="canvasPanel">
      <canvas id="gridCanvas" width="900" height="900"></canvas>
    </div>
  </div>

  <script type="module" src="/app/main.js"></script>
</body>
</html>
