<!DOCTYPE html>
<html lang="fr">
    <head>
        <meta charset="UTF-8" />
        <title>Into the Maze</title>
        <!-- Police "horror" pour le titre -->
        <link
            href="https://fonts.googleapis.com/css2?family=Creepster&display=swap"
            rel="stylesheet"
        />
        <style>
            /* Fond général sombre */
            body {
                background-color: #111;
                color: #eee;
                font-family: "Creepster", cursive;
                text-align: center;
            }

            /* Titre style horreur avec glow rouge */
            h1 {
                color: #ff4444;
                text-shadow: 0 0 5px red, 0 0 10px darkred;
                margin-top: 20px;
            }

            /* Canvas avec fond sombre, bordure et effet profondeur */
            canvas {
                border: 2px solid #555;
                margin-top: 20px;
                background-color: #222;
                box-shadow: 0 0 20px #000 inset;
            }
        </style>
    </head>
    <body>
        <h1>Into the Maze</h1>
        <canvas id="mazeCanvas" width="700" height="700"></canvas>
        <!-- Script principal du labyrinthe -->
        <script type="module" src="./demo.js"></script>
    </body>
</html>
